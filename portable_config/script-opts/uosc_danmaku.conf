## 指定弹幕服务器地址，自定义服务需兼容 dandanplay 的 api
## 可指定多个用英文逗号分隔的有序 api_server 列表
## 支持每项使用 '|' 或 '#' 分隔备注，例如: "https://a.example.com|备用A" 或 "https://b.example.com#备用B"
#api_server=https://danmaku-api.152468.xyz
## 指定 b 站和爱腾优的弹幕获取的兜底服务器地址，主要用于获取非动画弹幕
## 可用： https://dmku.hls.one，https://dmku.hls.one
#fallback_server=https://dmku.hls.one
## 设置 tmdb 的 API Key，用于获取非动画条目的中文信息(当搜索内容非中文时)
## 可以在 https://www.themoviedb.org 注册后去个人账号设置界面获取
## 注意：自定义此参数时还需要对获取到的 API Key 进行 base64 编码
#tmdb_api_key=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=
## 自动加载网络弹幕
auto_load=no
## 自动加载本地弹幕
autoload_local_danmaku=yes
## 为 URL 串流播放场景自动加载弹幕
autoload_for_url=yes
## 当自动弹幕加载失败时，自动弹出搜索框让用户手动搜索
#auto_fallback_search=no
## 自动保存网络弹幕到本地（视频同目录下同名 xml 文件）
save_danmaku=no
## 保存哪一步之后的弹幕。三种取值：
##   raw      原始弹幕（只跳过被屏蔽的源）—— 上游原有行为，默认
##   filtered 再额外去掉黑名单（blacklist_path）命中的
##   merged   再经 pakku 合并，即屏幕上实际显示的样子（文本带 (12) 标记）
##! 需要 save_danmaku=yes 才会自动保存；也可以随时执行
##!   script-message immediately_save_danmaku
##! 手动存一次。
##! merged 存的是「快照」：条数少得多（实测 6702 → 4884），下次把它当成本地
##! 弹幕加载就能复现同样的观感，不用再合并一遍。
##! 它依赖渲染时算好的结果，所以要在弹幕已经显示过之后保存才有效。
save_danmaku_mode=raw
## 读到自己保存的弹幕文件时怎么处理。两种取值：
##   auto   按文件里的阶段标签接着跑（默认）
##   ignore 忽略标签，一律当原始弹幕从头处理
##! 为什么需要这个：merged 存出来的正文是 `恭喜(12)` 这种带标记的文本。
##! 把它当普通弹幕源再合并一遍，标记会被当成正文参与相似度 ——
##! 实测 4775 条会变成 4655 条，而且冒出 `恭喜(12)(3)` 这种叠加标记，快照就毁了。
##! 所以保存时会在文件里写一条标准 XML 注释记录阶段：
##!   <!-- uosc_danmaku:stage=merged -->
##! 加载时读出来，已经做过的步骤就不重做。
##! 用注释是因为它是标准 XML，其它播放器（DanDanPlay 等）会直接忽略。
##! raw 不写标签 —— 「没有标签」本来就等于 raw。
##! 想在改过黑名单/pakku 参数之后拿旧快照重新跑一遍，就设成 ignore。
save_danmaku_resume=auto
## 启用 fps 视频滤镜让弹幕滚动更平滑
##! 性能消耗较大
vf_fps=yes
## 设置要使用的 fps 滤镜参数
#fps=60/1.001
## 指定合并重复弹幕的时间间隔的容差值，单位为秒。默认值：-1，表示禁用
merge_tolerance=5
## 合并重复弹幕时是否忽略类型和颜色差异。默认值：no
#merge_without_style=yes
## 合并弹幕字号的对数增长系数，必须为正整数
#merge_fontsize_growth=8
## 合并弹幕允许使用的最大字号
#merge_fontsize_max=100
## 限制同屏显示的最大弹幕数量，默认值 0 表示不限制
max_screen_danmaku=0

## ==================== pakku 弹幕合并（移植自 pakku.js） ====================
## 启用后接管上面的 merge_tolerance 合并流程。除了“文本完全相同”，还会用
## 字符频率编辑距离、拼音距离、bigram 余弦相似度判定相似，把相似弹幕聚成
## 一个簇，并用出现次数最多的版本显示，末尾打上合并数量（如 恭喜(12)）。
##
## 下面这组值基本等于 pakku.js 的 DEFAULT_CONFIG（background/config.ts），
## 有意偏离的只有两处，都标了 ##! 说明：
##   1. pakku_mark      —— pakku.js 默认标在开头，这里标在末尾
##   2. pakku_mark_subscript —— pakku.js 默认用下标 ₍₁₂₎，这里用普通数字 (12)
##! 与 merge_tolerance 互斥：启用 pakku 时 merge_tolerance 不再生效
pakku_enable=yes
## 滑动窗口的时间阈值，单位为秒。只有落在同一窗口内的弹幕才会互相比较
## pakku.js: THRESHOLD=30。调大能合并到更多相似弹幕，但耗时随之增长
pakku_threshold=30
## 字符频率编辑距离的上限，越大越容易把不同文本判为相似（0 表示只能靠拼音和余弦）
## pakku.js: MAX_DIST=5
pakku_max_dist=5
## bigram 余弦相似度阈值（0-100）。填大于 100 的值可禁用该判定
## pakku.js: MAX_COSINE=45
pakku_max_cosine=45
## 是否启用拼音距离，用于合并谐音弹幕（如“在”和“再”、“是”和“事”）
## pakku.js: TRIM_PINYIN=on
pakku_use_pinyin=yes
## 是否允许不同类型（滚动/顶部/底部）的弹幕互相合并
## pakku.js: CROSS_MODE=on
pakku_cross_mode=yes
## 合并数量标记的位置：off / suffix / prefix
##! 有意偏离 pakku.js 的 DANMU_MARK=prefix，沿用 uosc_danmaku 习惯的后缀位置
##  效果形如：恭喜(12)
pakku_mark=suffix
## 标记是否用下标数字：no -> (12) 普通数字跟随正文字体，yes -> ₍₁₂₎ 下标
##! pakku.js 的默认是 DANMU_SUBSCRIPT=on（下标），这里默认关掉：
##  下标字形只有正文字体的五成多高（实测各字体在 47%~63% 之间浮动），
##  看着偏小且随字体变化，用普通数字跟随正文字体观感更稳定
pakku_mark_subscript=no
## 下标标记的额外放大倍数，用来补偿下标字形天生偏小的问题
##! 只在 pakku_mark_subscript=yes 时才有意义；默认的 (12) 不受影响
##  pakku.js 本身没有给标记单独设字号，₍₁₂₎ 之所以小是因为下标字形就这么小
##  实测 Microsoft YaHei Bold：下标数字 ₀-₉ 只有正文数字的 55.4% 高
##    1     = 不放大，完全还原 pakku.js 的原始观感（标记明显偏小）
##    1.46  = 下标括号与正文数字同高
##    1.8   = 下标数字与正文数字同高
pakku_mark_scale=1.8
## 合并数量超过该值时才会添加标记
## pakku.js: MARK_THRESHOLD=1
pakku_mark_threshold=1
## 是否按合并数量放大字号，让热门弹幕更醒目
## pakku.js: ENLARGE=on
pakku_enlarge=yes
## 合并数量超过该值后才开始放大字号
## pakku.js: calc_enlarge_rate() 里是 count<=5 不放大
pakku_enlarge_min_count=5
## 字号放大的上限倍数
pakku_enlarge_max_scale=2.0
## 放大系数的对数底数（默认 5，等价于 pakku.js 的 log(n)/log(5)）
##! 该底数下合并 25 条即翻倍，再多也保持上限 2 倍
pakku_enlarge_log_base=5
## 是否把底部弹幕提升为优先级最高的类型
## pakku.js: MODE_ELEVATION=on
pakku_mode_elevation=yes
## 选取簇内第百分之几的成员作为代表（决定合并后的时间、颜色、字号）
## pakku.js: REPRESENTATIVE_PERCENT=20
pakku_representative_percent=20
## 合并后是否显示预处理过的文本；关闭则显示出现次数最多的原始文本
pakku_normalize_display=yes
## 文本预处理开关：去尾部标点 / 全角半角归一 / 合并多余空格
## pakku.js: TRIM_ENDING / TRIM_WIDTH / TRIM_SPACE 均为 on
pakku_trim_ending=yes
pakku_trim_width=yes
pakku_trim_space=yes
## 自定义替换规则，JSON 数组 [[模式, 替换], ...]
## 模式为 Lua 模式，额外支持 JS 风格的 {n} / {n,} / {n,m} 量词
## pakku.js: FORCELIST=[["^23{2,}$","23333"],["^6{3,}$","66666"]]
pakku_forcelist=[["^23{2,}$","23333"],["^6{3,}$","66666"]]
## 同屏显示密度阈值，超过后整体缩小字号。0 表示禁用
## pakku.js: SHRINK_THRESHOLD=0
##! 数值需要按自己的 fontsize 调整，值越小越容易触发
pakku_shrink_threshold=0
## 同屏显示密度阈值，超过后按权重丢弃低优先级弹幕。0 表示禁用
## pakku.js: DROP_THRESHOLD=0
pakku_drop_threshold=0
## ==========================================================================

## 指定弹幕关联历史记录文件的路径，支持绝对路径和相对路径
history_path=~~/files/danmaku-history.json

## 中文简繁转换。0-不转换，1-转换为简体，2-转换为繁体
chConvert=0
## 滚动弹幕的显示时间。这会左右滚动速度
scrolltime=15
## 固定弹幕的显示时间
fixtime=5
## 字体
fontname=Microsoft YaHei
## 字体大小 
fontsize=50
## 透明度
opacity=0.7
## 粗体
bold=yes
## 描边 0-4
outline=1
## 阴影
shadow=0
## 全部弹幕的显示范围（0.0-1.0）
displayarea=0.85

## ==== 一键搜索（给没有键盘的环境用：安卓 mpv、遥控器、手柄）====
## 直接拿文件名解析出的番剧名去搜，跳过需要打字和回车的搜索框，
## 结果照常以菜单列出，点选即可。
## 留空 = 不绑定快捷键；也可以留空、改用 script-message 绑到安卓前端的自定义按钮：
##   script-message danmaku-quick-search
## 另外该消息也接受一个可选参数，用来手动指定关键词：
##   script-message danmaku-quick-search "孤独摇滚"
#danmaku_quick_search_key=
## 自动选择搜索结果：yes 时不再弹出需要键盘上下选 + 回车的列表，
## 而是按「标题相似度 + 类型关键词 + 噪音关键词」打分自动挑一条番剧，
## 再按文件名推断的集数自动选集。
##! 0.8.6 起默认 yes。实测（安卓 mpvex）没装 uosc 时那个列表是 mpv 自带的
##! input.select，纯键盘（上下键 + 回车），没键盘根本选不了 ——
##! 表现就是「日志里搜到 2 条，然后卡住不动」。
##! 桌面用户想自己挑就改成 no。
##! 打分用的是几张固定关键词表，可能挑错；挑错了改回 no 即可。
danmaku_auto_select=yes
## 流程跟踪上屏：把「一键搜索 → 搜索 → 选番剧 → 选集 → 拉弹幕」每一步显示在屏幕上。
##! 注意：这些步骤**一直**会写进日志（info 级，屏幕上看不见，一行一个节点），
##! 不需要这个开关。开关只额外决定「要不要显示在屏幕上」。
##! 只在排查时打开，平时会一直刷屏。
#danmaku_verbose_osd=no

## 指定弹幕屏蔽词文件路径（black.txt），支持绝对路径和相对路径。文件内容以换行分隔
## 支持 lua 的正则表达式写法
#blacklist_path=
## 自定义标题解析中的额外替换规则，内容格式为 JSON 字符串，替换模式为 lua 的 string.gsub 函数
##! 注意：由于 mpv 的 lua 版本限制，自定义规则只支持形如 %n 的捕获组写法，即示例用法，不支持直接替换字符的写法 
title_replace=[{"rules":[{ "^〔(.-)〕": "%1"},{ "^.*《(.-)》": "%1" }]}]
## 指定哈希匹配中需忽略的共享盘（挂载盘）的路径/目录。支持绝对路径和相对路径，多个路径用逗号分隔
## 示例：["X:", "Z:", "F:/Download/", "Download"]
#excluded_path=